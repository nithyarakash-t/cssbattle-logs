<div></div>
<style>
  body {
    background: #62306D;
    place-items: center;
    place-content: center;
    display: flex;
    gap: 2.5rem;
  }
  div {
    --_bg: #AA445F;
    --_y: -25px;
    width: 100px;
    aspect-ratio: 1/1.5;
    background: radial-gradient(circle 50px at 50% 100px, #F7EC7D 0 100%, transparent) no-repeat, var(--_bg);
    border-radius: 100px;
    translate: 0 var(--_y);
    &:nth-child(2) {
      --_bg: #E38F66;
      --_y: 25px;
      rotate: 180deg;
    }
  }
</style>
