     --_bg: #2D9CDB;
   }

     rotate: -45deg;
   }
   &:nth-child(2) {
     rotate: 45deg;
   }
   &:nth-child(3) {
     rotate: 135deg;
   }
   &:nth-child(4) {
     rotate: 225deg;
   }
 }
</style>
